[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brymenble"
version = "0.1.0"
description = "Unofficial Python SDK for the Brymen BM78xBT Bluetooth Low Energy multimeter"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Martin Chan", email = "17235188+milksplash@users.noreply.github.com" },
]
dependencies = [
    "bleak>=0.21",
]

[project.optional-dependencies]
test = [
    "pytest",
]
dev = [
    "pytest",
    "build",
    "twine",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brymen = ["py.typed"]
